# Generates lib/l10n/app_localizations*.dart from the ARB files (flutter gen-l10n, also run by
# `flutter pub get` / `flutter run` because pubspec.yaml sets `generate: true`).
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
