name: self_infinity
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  go_router: ^18.0.2
  http: ^1.6.0
  intl: ^0.20.3
  path_drawing: ^1.0.1
  provider: ^6.1.5+1
  speech_to_text: ^7.5.0
  supabase_flutter: ^2.18.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Line-art pieces of the life tree (lib/widgets/ink_sprites.dart).
  assets:
    - assets/ink/

  # Display serif for headlines, big numbers and the identity quote (docs/DESIGN.md 2.2).
  # SIL Open Font License, see assets/fonts/OFL.txt.
  fonts:
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
