name: self_infinity
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_tts: ^4.2.5
  go_router: ^18.0.2
  http: ^1.6.0
  intl: ^0.20.3
  path_drawing: ^1.0.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0
  supabase_flutter: ^2.18.0
  url_launcher: ^6.3.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Localized strings from lib/l10n/*.arb (l10n.yaml).
  generate: true

  # Line-art pieces of the life tree (lib/widgets/ink_sprites.dart), the Chinese and Korean
  # fonts, loaded only when their language is picked (lib/theme/font_loader.dart), and the
  # front page's robot (lib/features/auth/landing_page.dart).
  assets:
    - assets/ink/
    - assets/fonts/cjk/
    - assets/landing/
    - assets/landing/frames/

  # Infinity Sans (Pretendard, Latin subset) for all text, Instrument Serif for headlines, big numbers and the
  # identity quote (docs/DESIGN.md 2.2). SIL Open Font License; see assets/fonts/README.md.
  fonts:
    - family: InfinitySans
      fonts:
        - asset: assets/fonts/InfinitySans-Regular.ttf
          weight: 400
        - asset: assets/fonts/InfinitySans-Medium.ttf
          weight: 500
        - asset: assets/fonts/InfinitySans-SemiBold.ttf
          weight: 600
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
